# 099 配布パッケージ フェーズ1: Mac + Windows(x64) を GitHub Actions のクラウドランナーで
# 自動ビルドし、【別の public リポジトリ satoh23/StreamDock-releases】の Releases 下書きに
# インストーラを添付する（このリポジトリ＝ソースは private のまま／VM・Docker 不要）。
#
# 仕組み:
#   1) build ジョブ（mac + windows x64 のマトリクス）が tauri-action でインストーラをビルドし、
#      成果物を workflow artifact として一時保存する（この段階では Release を作らない）。
#   2) release ジョブが全成果物をまとめてダウンロードし、public の StreamDock-releases に
#      Release 下書きを作って添付する。別リポジトリへ書くため GITHUB_TOKEN ではなく
#      Secrets の RELEASE_REPO_TOKEN（public リポジトリの Contents: Read/Write な PAT）を使う。
#
# トリガー: `v` 始まりのタグ push（例 v0.1.0）／手動実行（workflow_dispatch）。
# この段階は未署名（Windows は SmartScreen 警告あり＝フェーズ2で署名して解消）。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# このリポジトリ側の GITHUB_TOKEN は読み取りのみでよい（公開先へは PAT を使う）。
permissions:
  contents: read

# public 側の Release タグ名／表示名（タグ push はそのタグ名、手動実行は ci-<run番号>）。
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
  RELEASE_NAME: stream-dock ${{ github.ref_type == 'tag' && github.ref_name || format('CI build {0}', github.run_number) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: 1つの .dmg で Intel/Apple Silicon 両対応（universal binary）。
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          # Windows: 既定の x64 ランナー＝x86_64-pc-windows-msvc。NSIS(.exe)+WiX(.msi) を生成。
          - platform: windows-latest
            rust_targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Release は作らず、インストーラをビルドするだけ（tagName を渡さない）。
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      # 生成されたインストーラだけを workflow artifact として保存する。
      # 各 OS は自分の成果物のみ一致する（他 OS のパターンは 0 件でよい）。
      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      # public の StreamDock-releases に Release 下書きを作り、全 OS の成果物を添付する。
      - name: Publish to public releases repo (draft)
        uses: softprops/action-gh-release@v2
        with:
          repository: satoh23/StreamDock-releases
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          draft: true
          files: dist/**/*
