# 099 配布パッケージ フェーズ1: Mac + Windows(x64) を GitHub Actions のクラウドランナーで
# 自動ビルドし、【別の public リポジトリ satoh23/StreamDock-releases】の Releases 下書きに
# インストーラを添付する（このリポジトリ＝ソースは private のまま／VM・Docker 不要）。
#
# 仕組み:
#   1) build ジョブ（mac + windows x64 のマトリクス）が tauri-action でインストーラをビルドし、
#      成果物を workflow artifact として一時保存する（この段階では Release を作らない）。
#   2) release ジョブが全成果物をまとめてダウンロードし、public の StreamDock-releases に
#      Release 下書きを作って添付する。別リポジトリへ書くため GITHUB_TOKEN ではなく
#      Secrets の RELEASE_REPO_TOKEN（public リポジトリの Contents: Read/Write な PAT）を使う。
#
# トリガー: `v` 始まりのタグ push（例 v0.1.0）／手動実行（workflow_dispatch）。
# Windows は署名 Secrets（ES_USERNAME 他）があれば **バンドル過程の中で**コード署名する（099a・フェーズ2）。
# Secrets 未設定なら未署名のまま（SmartScreen 警告あり）。macOS は当面未署名。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# このリポジトリ側の GITHUB_TOKEN は読み取りのみでよい（公開先へは PAT を使う）。
permissions:
  contents: read

# public 側の Release タグ名／表示名（タグ push はそのタグ名、手動実行は ci-<run番号>）。
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
  RELEASE_NAME: stream-dock ${{ github.ref_type == 'tag' && github.ref_name || format('CI build {0}', github.run_number) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: 1つの .dmg で Intel/Apple Silicon 両対応（universal binary）。
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          # Windows: 既定の x64 ランナー＝x86_64-pc-windows-msvc。NSIS(.exe) のみ生成する
          # （WiX の .msi は tauri.conf.json の bundle.targets から外した。055a）。
          - platform: windows-latest
            rust_targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    # Windows 署名は SSL.com の Secrets（ES_USERNAME）が設定されている時だけ実行する。
    # 未設定なら未署名でビルド＝CI は緑のまま。証明書取得前でも comment-viewer 入り MVP を配布でき、
    # Secrets を入れた瞬間からコード変更なしで自動署名に切り替わる。
    # ⚠ この env が直接ゲートするのは **①署名構成のガード ②jsign の導入** の 2 ステップだけ。
    #   署名そのものは tauri のバンドル過程の中（`signCommand`）で走るので、
    #   「署名するかどうか」は `Build installers` が渡す STREAMDOCK_WINDOWS_SIGNING で伝える（099a）。
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.ES_USERNAME != '' }}

    steps:
      # 055a: このジョブは updater の秘密鍵（TAURI_SIGNING_PRIVATE_KEY）を扱うため、
      # `.git/config` に GITHUB_TOKEN を残さない（release ジョブの checkout と揃える）。
      # tauri-action は `tagName` を渡していない＝Release を作らないので git 資格情報は不要。
      # pnpm-lock.yaml に git 依存（`git+…`）も無いので、fetch にも影響しない。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 供給網対策: **サードパーティ Action はコミット SHA へ固定する**。
      #   このジョブは後段の `Build installers` で updater 秘密鍵と Windows 署名資格情報を扱う。
      #   `dtolnay/rust-toolchain` を固定したのとまったく同じ理屈で——同一ジョブの Action は
      #   ワークスペースと PATH を書き換えられるので、ステップ単位の env でも後続ステップの
      #   秘密を奪うラッパを仕込みうる——ここも可動タグのままにはできない。
      #   固定時点で `v4` が指していた commit と同一なので**挙動は変わらない**。更新は手動で行う。
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 055a: バージョン番号 5 箇所（root/desktop/sidecar の package.json・Cargo.toml [package]・tauri.conf.json）の
      # 同期を確かめる。タグ push のときは EXPECT_VERSION でタグ名との一致も検査する
      # （`v` を除いたタグ名 == 5 箇所）。ズレたまま配信すると updater が無反応になるか、下位バージョンを
      # 配って更新ループを作る。**重いビルドの前に置く**ことで数十秒で落ちる。
      # 検査ロジックはローカルの `pnpm check:version` とまったく同じスクリプト（二重管理を作らない）。
      - name: Check version sync
        shell: bash
        run: node apps/desktop/scripts/check-version-sync.mjs
        env:
          EXPECT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      # 055a: **ビルド後の置換署名は updater の minisign 署名を壊す**（`.sig` はバンドル時点のバイト列に対して
      # 作られるため）。壊れ方が「CI 緑・インストーラも動く・自己更新だけが静かに落ちる」で 099b の実機 E2E まで
      # 発覚せず、かつ 099a の作業者が 055a のタスクファイルを読む保証がないので、**文書ではなく検査**で止める。
      # 実行条件は下の署名ステップと同じ `HAS_WINDOWS_SIGNING == 'true'`＝**今日は no-op**で、
      # 099a で Secrets を入れた瞬間にここで止まる。移行手順はスクリプトのエラー文に書いてある。
      # ⚠ 設定ファイルとワークフローを読むだけなので、**重いビルドの前**に置く（`Check version sync` と同じ思想）。
      - name: Guard - post-build signing breaks updater signature (099a)
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: bash
        run: node .github/scripts/check-updater-signing-compat.mjs

      # 099a: 署名ラッパーを**重いビルドの前に**空打ちして、構文と分岐だけ確かめる。
      #   ⚠⚠ `signCommand` を置くと **Secrets の有無に関係なく** sign-windows.ps1 が約 9 回呼ばれる。
      #     つまり「構文エラー」「置き場所の誤り」は **cargo の 15 分ビルドが終わった後**に初めて露見する。
      #     実際 2026-09-01 の空回しで、スクリプトの置き場所を誤って `failed to run pwsh` を踏んだ
      #     （`signCommand` の相対パスの基準は projectPath ではなく **`src-tauri`**。tauri CLI が
      #      build の途中で `set_current_dir(dirs.tauri)` を呼ぶため）。数秒で落ちる検査をここに置く。
      #   ⚠ `Check version sync` / 上のガードと同じ「重いものの前に落とす」思想。
      #   ⚠ Secrets を使わないので **Windows レグでは常に走る**（署名の有効・無効に関係なく）。
      - name: Smoke-test the Windows signing wrapper (099a)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $script = 'apps/desktop/src-tauri/scripts/sign-windows.ps1'
          # 署名は**しない**経路だけを通すので、この引数のファイルは読まれも書かれもしない。
          $dummy = 'apps/desktop/src-tauri/tauri.conf.json'
          # 子プロセスがジョブサマリへ書かないようにする（②は「わざと失敗させる」ので紛らわしい）。
          $env:GITHUB_STEP_SUMMARY = ''

          # ① 署名が無効なら「何もせず成功」で返ること（＝ Secrets 未設定でも未署名でビルドが通る性質）
          $env:STREAMDOCK_WINDOWS_SIGNING = '0'
          $out = & pwsh -NoProfile -File $script $dummy 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host $out
            Write-Host "::error::sign-windows.ps1 が no-op 経路で失敗した（exit $LASTEXITCODE）"
            exit 1
          }

          # ② 署名が有効なのに資格情報が無いなら**落ちる**こと（fail-closed。未署名で素通りさせない）
          $env:STREAMDOCK_WINDOWS_SIGNING = '1'
          foreach ($name in 'JSIGN_JAR', 'ES_USERNAME', 'ES_PASSWORD', 'CREDENTIAL_ID', 'ES_TOTP_SECRET') {
            Set-Item -Path "Env:$name" -Value ''
          }
          $out = & pwsh -NoProfile -File $script $dummy 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            Write-Host $out
            Write-Host "::error::資格情報が無いのに成功で返った（fail-closed が壊れている）"
            exit 1
          }

          Write-Host "sign-windows.ps1: 構文・no-op 経路・fail-closed を確認した"

          # ⚠⚠⚠ **必須**。GitHub は `shell: pwsh` のスクリプト末尾に `exit $LASTEXITCODE` を自動で付ける。
          #   ②で**わざと失敗させた** pwsh の終了コード 1 が残っているため、これが無いと
          #   **検査は全部通っているのにステップだけが赤くなる**（2026-09-01 に実際に踏んだ）。
          exit 0

      # 055a: このジョブは updater 秘密鍵を扱うため、**ブランチ参照（`@stable`）をやめてコミット SHA へ固定**する
      #   （`tauri-action` を固定したのと同じ理屈。同一ジョブの Action はワークスペースと PATH を書き換えられるので、
      #   ステップ単位の env でも後続ステップの秘密を奪うラッパを仕込みうる）。
      #   固定先は固定時点の `stable` ブランチ HEAD で、`inputs.toolchain` の既定は `stable` のまま
      #   ＝**インストールされる Rust は従来どおり stable 最新**（挙動は変わらない）。更新は手動で行う。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable ブランチ HEAD（2026-08-01 時点）
        with:
          targets: ${{ matrix.rust_targets }}

      # 上の `Setup pnpm` と同じ理由でコミット SHA へ固定する（同一ジョブに秘密がある）。
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 099a-(I): comment-sidecar（Node SEA）を tauri ビルド前に生成する。
      # tauri.conf.json の externalBin が binaries/comment-sidecar-<triple>[.exe] を要求し、
      # beforeBuildCommand の check:sidecar（鮮度ガード）が未生成だと fail するため、ここで先に作る。
      # 焼き込み env（Client ID/Secret）は Secrets 由来。GitHub が値を自動マスクし、build-sea は値を echo しない。

      # Windows(x64): host triple 1 本だけでよい（comment-sidecar-x86_64-pc-windows-msvc.exe）。
      - name: Build comment-sidecar (Windows x64)
        if: matrix.platform == 'windows-latest'
        run: pnpm --filter @stream-dock/comment-sidecar build:sea
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      # macOS: --target universal-apple-darwin では最終的に universal（fat）sidecar 1 本が要る（後段の lipo で作る）。
      # まず両 arch を用意する。build-sea は host arch 1 本のみ生成（triple は rustc host＝arm64 ランナーでは常に aarch64）。
      # build-sea 無改変で両 arch を用意するため、x64 node(Rosetta) で作って rename → native arm64 で作る。
      # 注: build-sea 内の esbuild は arch 一致のネイティブバイナリを要求するため、node arch 切替ごとに
      #     pnpm install が要る（本方式唯一の煩雑点）。
      - name: Ensure Rosetta 2 (for x64 sidecar)
        if: matrix.platform == 'macos-latest'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Setup Node (x64, for x86_64 sidecar)
        if: matrix.platform == 'macos-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: x64

      - name: Build comment-sidecar x86_64 (Rosetta node)
        if: matrix.platform == 'macos-latest'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @stream-dock/comment-sidecar build:sea
          mv apps/desktop/src-tauri/binaries/comment-sidecar-aarch64-apple-darwin \
             apps/desktop/src-tauri/binaries/comment-sidecar-x86_64-apple-darwin
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      - name: Setup Node (arm64, restore native)
        if: matrix.platform == 'macos-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: arm64

      - name: Build comment-sidecar aarch64 (native)
        if: matrix.platform == 'macos-latest'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @stream-dock/comment-sidecar build:sea
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      # macOS universal ビルドでは、tauri は externalBin として per-arch 2 本ではなく
      # 単一の universal（fat）バイナリ `comment-sidecar-universal-apple-darwin` を要求する
      # （無いと bundle 時に "resource path binaries/comment-sidecar-universal-apple-darwin doesn't exist" で失敗）。
      # そこで x86_64 と aarch64 を lipo で 1 本に結合し ad-hoc 署名し直す。
      # aarch64 単体も残す（beforeBuildCommand の check:sidecar が host=aarch64 を検査するため）。
      - name: Create universal sidecar (lipo)
        if: matrix.platform == 'macos-latest'
        run: |
          cd apps/desktop/src-tauri/binaries
          lipo -create \
            comment-sidecar-x86_64-apple-darwin \
            comment-sidecar-aarch64-apple-darwin \
            -output comment-sidecar-universal-apple-darwin
          codesign --force --sign - comment-sidecar-universal-apple-darwin
          lipo -info comment-sidecar-universal-apple-darwin

      # 099a-(II): Windows のコード署名ツール（jsign）を **CI 上にだけ** 用意する。
      #   Windows インストーラは SSL.com の個人検証(IV)証明書＋eSigner（クラウド HSM）で署名する。
      #   日本在住の個人は Azure Trusted Signing の公開信頼証明書の対象外なので IV + eSigner を採った。
      #
      #   ⚠⚠ 署名は **tauri のバンドル過程の中**で行う（`tauri.conf.json` の `bundle.windows.signCommand`
      #     → `apps/desktop/src-tauri/scripts/sign-windows.ps1` → jsign → eSigner）。**ビルド後にインストーラを
      #     署名し直す形は採らない**——updater の `.sig`（minisign）はバンドル時点のバイト列に対して
      #     作られるので、後からバイト列を変えると Windows の自己更新だけが静かに壊れる（055a）。
      #     この構成は build ジョブ冒頭の `Guard - post-build signing breaks updater signature (099a)` が検査する。
      #
      #   なぜ jsign か: ①終了コードを正しく返すので tauri 側の fail-closed（`output_ok`）が本当に効く
      #     ②署名対象を外部へアップロードせず**ハッシュだけ**を送る（sidecar は 110MB あり、
      #     ビルド時に焼き込んだ Client Secret を含む）③資格情報を `env:` 指定で渡せる。
      #   供給網対策: **サードパーティ Action を使わない**。リリースタグ固定の URL から取得し、
      #     **SHA-256 を照合**してから使う。⚠ jar を更新するときはこのハッシュも手で上げること。
      #   §10: アプリの実行時依存は増やさない（Cargo.toml / package.json に差分ゼロ）。CI 上のみ。
      - name: Install jsign (Windows code signing)
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '7.5'
          $expected = '602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c'
          $jar = Join-Path $env:RUNNER_TEMP "jsign-$version.jar"

          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/ebourg/jsign/releases/download/$version/jsign-$version.jar" `
            -OutFile $jar

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $jar).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Host "::error::jsign-$version.jar の SHA-256 が一致しない（expected=$expected actual=$actual）"
            exit 1
          }
          Write-Host "jsign $version の SHA-256 を確認した"

          # jsign は Java 製。windows-latest には JDK がプリインストールされている前提だが、
          # 無いと **重いビルドの後**に署名で落ちるので、ここで先に確かめる。
          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
            Write-Host "::error::java が PATH に無い（jsign の実行に必要）"
            exit 1
          }
          & java -version 2>&1 | ForEach-Object { Write-Host $_ }

          "JSIGN_JAR=$jar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Release は作らず、インストーラをビルドするだけ（tagName を渡さない）。
      # Windows は署名 Secrets があればこの中で署名される（無ければ未署名。上の jsign ステップ参照）。
      #
      # 055a: updater 成果物（macOS `.app.tar.gz` / Windows インストーラ）の **minisign 署名**をここで作らせる。
      #   秘密鍵は GitHub の暗号化 Secrets のみに置き、**env で渡すだけ**（echo も run での参照もしない）。
      #   ⚠ tauri.conf.json に `createUpdaterArtifacts: true` と `pubkey` がある状態でこの env が無いと、
      #     bundle 段階で「A public key has been found, but no private key」で失敗する（ローカルビルドも同様）。
      #
      # 供給網対策（055a）: 本ステップに updater 秘密鍵を渡すようになったため、floating tag `@v0` をやめて
      #   コミット SHA へ固定する（099a で署名ツールをタグ固定＋SHA-256 照合で入れているのと同じ理屈）。
      #   固定時点で `v0` が指していた commit と同一なので**挙動は変わらない**。更新は手動で行う。
      - name: Build installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 099a: Windows のコード署名資格情報。**Windows レグかつ Secrets がある時だけ**値が入る
          #   （三項式で macOS へは空文字を渡す＝資格情報を渡さない。2026-07-21 の判断と同じ）。
          #   `signCommand` を設定すると tauri は Secrets の有無に関係なく署名コマンドを呼ぶので、
          #   「署名するかどうか」は STREAMDOCK_WINDOWS_SIGNING で sign-windows.ps1 に伝える
          #   （公式の `--no-sign` は **updater の minisign 署名まで止めてしまう**ので使えない）。
          #   ⚠ 値はすべて Secrets 由来で GitHub が自動マスクする。ログにも tauri.conf.json にも書かない。
          STREAMDOCK_WINDOWS_SIGNING: ${{ (matrix.platform == 'windows-latest' && secrets.ES_USERNAME != '') && '1' || '0' }}
          ES_USERNAME: ${{ matrix.platform == 'windows-latest' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ matrix.platform == 'windows-latest' && secrets.ES_PASSWORD || '' }}
          CREDENTIAL_ID: ${{ matrix.platform == 'windows-latest' && secrets.CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ matrix.platform == 'windows-latest' && secrets.ES_TOTP_SECRET || '' }}

      # 055a: updater 成果物が本当に生成されたかを明示的に確かめる。
      # ⚠ 後段の `upload-artifact` の `if-no-files-found: error` は **全パターンが 0 件**のときしか失敗しない。
      #   つまり `.sig` が 1 つも生成されなくても既存の dmg/exe が拾われる限り **CI は緑のまま**通ってしまい、
      #   「配ったのに誰も更新できない」状態に気づけない。だから存在チェックを別に置く。
      # 併せて bundle ディレクトリの中身を出力する（Tauri のバージョンによって変わる**実ファイル名**を
      # 空回しのログから確定させるため）。
      - name: Verify updater artifacts
        shell: bash
        run: |
          # ⚠ `shell: bash` を明示すると GitHub は `bash --noprofile --norc -eo pipefail {0}` で起動する＝
          #    **`-e` は最初から有効**。`set -uo pipefail` を書いても `-e` は解除されない。
          #    ここは `$(find … | head -n1)` を使っており、`pipefail` と `-e` の組み合わせでは
          #    find の非ゼロ終了（探索エラー・head の早期終了による SIGPIPE）で**代入の時点でステップが即死**し、
          #    下の `::error::` も bundle 一覧も出ない——本ステップの主目的（実ファイル名をログに残す）が
          #    失敗時にだけ失われる。Windows の git-bash では find が非ゼロを返しやすいので実際に起こりうる。
          #    そこで **明示的に `-e` を落とす**。欠落の判定は下の `missing` と `exit 1` が担う。
          set +e
          set -uo pipefail
          root="apps/desktop/src-tauri/target"
          missing=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            archive=$(find "$root" -path "*/release/bundle/macos/*" -name "*.app.tar.gz" 2>/dev/null | head -n1)
            sig=$(find "$root" -path "*/release/bundle/macos/*" -name "*.app.tar.gz.sig" 2>/dev/null | head -n1)
            [ -n "$archive" ] || missing="${missing} macOS の updater アーカイブ(*.app.tar.gz);"
            [ -n "$sig" ] || missing="${missing} その minisign 署名(*.app.tar.gz.sig);"
          else
            # Windows は `.sig` だけを見る（macOS と非対称）。`.app.tar.gz` は updater 専用の別成果物なので
            # 本体の有無も確かめる必要があるが、Windows の署名対象は**インストーラそのもの**で、
            # `*.exe.sig` があれば署名元の `*.exe` は必ず存在するため。
            sig=$(find "$root" -path "*/release/bundle/nsis/*" -name "*.exe.sig" 2>/dev/null | head -n1)
            [ -n "$sig" ] || missing="${missing} Windows NSIS インストーラの minisign 署名(*.exe.sig);"
          fi
          echo "--- bundle ディレクトリの中身（実ファイル名の確認用） ---"
          find "$root" -path "*/release/bundle/*" -type f 2>/dev/null | sed "s|^|  |"
          if [ -n "$missing" ]; then
            echo "::error::updater 成果物が生成されていません:${missing}"
            echo "tauri.conf.json の bundle.createUpdaterArtifacts と、Build installers の署名鍵 env" >&2
            echo "（TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD）を確認してください。" >&2
            exit 1
          fi
          echo "updater 成果物 OK"

      # 生成されたインストーラと updater 成果物を workflow artifact として保存する。
      # 各 OS は自分の成果物のみ一致する（他 OS のパターンは 0 件でよい）。
      # ⚠ `.msi`(WiX) は配布対象外にした（tauri.conf.json の `bundle.targets` から外した）ので glob も持たない。
      #   理由は tauri.conf.json 側と `make-latest-json.mjs` の `windows-x86_64` のコメントを参照。
      # 055a: updater 成果物（macOS の `.app.tar.gz` と各インストーラの `.sig`）を追加する。
      #   ⚠ **ファイル名は決め打ちしない**（Tauri のバージョンで変わるため）。ディレクトリを限定した
      #     拡張子ワイルドカードにしておき、実ファイル名は空回しのログで確定させる。
      #   ⚠ `if-no-files-found: error` は「全パターンが 0 件」でしか落ちないので、欠落検出は
      #     上の `Verify updater artifacts` と release ジョブの latest.json 生成側（fail-closed）が担う。
      # ⚠ 保持は **1 日**（最短）。この artifact は release ジョブが**同じ run の中で**ダウンロードして
      #   public 側へ添付するための受け渡しでしかなく、長く置く意味が無い。一方で成果物は大きく
      #   （sidecar だけで 110MB ×〔dmg / app.tar.gz / NSIS exe〕）、**1 回の空回しで数百 MB** 使うため、
      #   3 日保持だと Actions のストレージ枠がすぐ埋まり
      #   `Failed to CreateArtifact: Artifact storage quota has been hit` でビルドが落ちる（2026-09-01 に発生）。
      #   ⚠⚠ **人が実機確認のためにインストーラを落とすのは、run の当日中に行うこと。**
      #     期限切れ後に必要になったら run を再実行する（あるいは `cleanup-artifacts` の注意書きを参照）。
      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 055a: latest.json の生成に、リリースノート（docs/release-notes/）と生成スクリプトと
      # バージョンの単一ソース（tauri.conf.json）が要るので checkout する。
      # ⚠ **必ず download-artifact より前に置くこと。** actions/checkout は既定 `clean: true` で、
      #   ワークスペースが git リポジトリでない場合は**中身を削除してから**チェックアウトするため、
      #   後ろに置くと dist/ が消える。
      # `permissions: contents: read`（ワークフロー冒頭）のままで足りる。public 側への書き込みは
      # 従来どおり RELEASE_REPO_TOKEN。同じジョブで PAT を扱うので、.git/config に GITHUB_TOKEN を残さない。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      # 055a: updater が読む静的 latest.json と、Release 本文を生成する（**新しい Action は増やさず素の node**）。
      #   - version は tauri.conf.json が単一ソース（空回しでも semver になる。タグ push 時は build ジョブの
      #     Check version sync がタグ名との一致を保証している）。
      #   - notes は docs/release-notes/v<version>.md が単一ソース。**タグ push 時に無ければ fail**。
      #   - updater 成果物が欠けている / .sig と対になっていない場合も fail（fail-closed）。
      #   latest.json は dist/ 直下に書くので、下の `files: dist/**/*` がそのまま添付する。
      #   Release 本文は dist/ の**外**（release-body.md）へ書く（中に書くと成果物として添付されてしまう）。
      #   注: このジョブは `actions/setup-node` を通さず **ubuntu ランナー既定の node** を使う（build ジョブとは非対称）。
      #   スクリプトは node の標準 API しか使わないため十分だが、ランナーイメージ側の node が前提であることは意識しておく。
      - name: Generate latest.json
        run: node .github/scripts/make-latest-json.mjs
        env:
          # RELEASE_TAG はワークフロー冒頭の env で全ステップに渡っている（ここで再定義しない）。
          RELEASE_REPO: satoh23/StreamDock-releases
          IS_TAG: ${{ github.ref_type == 'tag' }}
          DIST_DIR: dist
          BODY_PATH: release-body.md

      # public の StreamDock-releases に Release 下書きを作り、全 OS の成果物と latest.json を添付する。
      # ⚠ `draft: true` は維持する。draft のうちは releases/latest/download/latest.json が 404 になり
      #   updater からは見えない＝**成果物を確認してから publish する**安全弁。
      #   **publish した瞬間に全ユーザーへ配信が始まる**（README のリリース手順に明記）。
      # ⚠ `prerelease` は **タグ push でないとき（空回し）に true** にする。
      #   GitHub の `releases/latest` は **draft と prerelease の両方を除外**するので、
      #   手動実行の下書き `ci-<番号>` を誤って publish しても **updater からは決して見えない**。
      #   draft・下書き名・README の注意はいずれも人間依存だったが、これは機械的な安全弁になる。
      #   （空回しの Release 本文には make-latest-json.mjs が警告バナーも付ける）
      # ⚠⚠ 供給網対策: ここは **RELEASE_REPO_TOKEN（配布リポジトリの Contents: Read/Write な PAT）を
      #   直接受け取り、実際に配布物を Releases へ置く当事者**。可動タグのままだと、この Action が
      #   乗っ取られた時点で「ダウンロード先のファイルを差し替える」が LP を一切触らずに成立する。
      #   本ファイルは jsign / tauri-action / rust-toolchain を「秘密を扱うから」という理由で
      #   固定しているのに、**一番配布物に近いここだけが可動タグのままだった**（2026-09-06 のレビューで発覚）。
      #   固定時点で `v2` が指していた commit と同一なので**挙動は変わらない**。更新は手動で行う。
      #   ⚠ `actions/*`（checkout / setup-node / upload-artifact / download-artifact）は GitHub 自身が
      #     所有しているので可動タグのままにしている。ここが線引き。
      - name: Publish to public releases repo (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: satoh23/StreamDock-releases
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          draft: true
          prerelease: ${{ github.ref_type != 'tag' }}
          body_path: release-body.md
          files: dist/**/*
