# 099 配布パッケージ フェーズ1: Mac + Windows(x64) を GitHub Actions のクラウドランナーで
# 自動ビルドし、【別の public リポジトリ satoh23/StreamDock-releases】の Releases 下書きに
# インストーラを添付する（このリポジトリ＝ソースは private のまま／VM・Docker 不要）。
#
# 仕組み:
#   1) build ジョブ（mac + windows x64 のマトリクス）が tauri-action でインストーラをビルドし、
#      成果物を workflow artifact として一時保存する（この段階では Release を作らない）。
#   2) release ジョブが全成果物をまとめてダウンロードし、public の StreamDock-releases に
#      Release 下書きを作って添付する。別リポジトリへ書くため GITHUB_TOKEN ではなく
#      Secrets の RELEASE_REPO_TOKEN（public リポジトリの Contents: Read/Write な PAT）を使う。
#
# トリガー: `v` 始まりのタグ push（例 v0.1.0）／手動実行（workflow_dispatch）。
# この段階は未署名（Windows は SmartScreen 警告あり＝フェーズ2で署名して解消）。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# このリポジトリ側の GITHUB_TOKEN は読み取りのみでよい（公開先へは PAT を使う）。
permissions:
  contents: read

# public 側の Release タグ名／表示名（タグ push はそのタグ名、手動実行は ci-<run番号>）。
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
  RELEASE_NAME: stream-dock ${{ github.ref_type == 'tag' && github.ref_name || format('CI build {0}', github.run_number) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: 1つの .dmg で Intel/Apple Silicon 両対応（universal binary）。
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          # Windows: 既定の x64 ランナー＝x86_64-pc-windows-msvc。NSIS(.exe)+WiX(.msi) を生成。
          - platform: windows-latest
            rust_targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    # Windows 署名は SSL.com の Secrets（ES_USERNAME）が設定されている時だけ実行する。
    # 未設定なら署名ステップをスキップし未署名でビルド＝CI は緑のまま。証明書取得前でも
    # comment-viewer 入り MVP を配布でき、Secrets を入れた瞬間からコード変更なしで自動署名に切り替わる。
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.ES_USERNAME != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 099a-(I): comment-sidecar（Node SEA）を tauri ビルド前に生成する。
      # tauri.conf.json の externalBin が binaries/comment-sidecar-<triple>[.exe] を要求し、
      # beforeBuildCommand の check:sidecar（鮮度ガード）が未生成だと fail するため、ここで先に作る。
      # 焼き込み env（Client ID/Secret）は Secrets 由来。GitHub が値を自動マスクし、build-sea は値を echo しない。

      # Windows(x64): host triple 1 本だけでよい（comment-sidecar-x86_64-pc-windows-msvc.exe）。
      - name: Build comment-sidecar (Windows x64)
        if: matrix.platform == 'windows-latest'
        run: pnpm --filter @stream-dock/comment-sidecar build:sea
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      # macOS: --target universal-apple-darwin のため externalBin は aarch64 と x86_64 の 2 本が要る。
      # build-sea は host arch 1 本のみ生成（triple は rustc host＝arm64 ランナーでは常に aarch64）。
      # build-sea 無改変で両 arch を用意するため、x64 node(Rosetta) で作って rename → native arm64 で作る。
      # 注: build-sea 内の esbuild は arch 一致のネイティブバイナリを要求するため、node arch 切替ごとに
      #     pnpm install が要る（本方式唯一の煩雑点）。
      - name: Ensure Rosetta 2 (for x64 sidecar)
        if: matrix.platform == 'macos-latest'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Setup Node (x64, for x86_64 sidecar)
        if: matrix.platform == 'macos-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: x64

      - name: Build comment-sidecar x86_64 (Rosetta node)
        if: matrix.platform == 'macos-latest'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @stream-dock/comment-sidecar build:sea
          mv apps/desktop/src-tauri/binaries/comment-sidecar-aarch64-apple-darwin \
             apps/desktop/src-tauri/binaries/comment-sidecar-x86_64-apple-darwin
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      - name: Setup Node (arm64, restore native)
        if: matrix.platform == 'macos-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: arm64

      - name: Build comment-sidecar aarch64 (native)
        if: matrix.platform == 'macos-latest'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @stream-dock/comment-sidecar build:sea
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      # Release は作らず、インストーラをビルドするだけ（tagName を渡さない）。未署名で生成する。
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      # 099a-(II): Windows インストーラを SSL.com eSigner（クラウド署名）で署名する。
      # 日本の個人は Azure Trusted Signing 対象外のため、個人検証(IV)証明書＋eSigner を採用。
      # tauri ビルド後に NSIS(.exe)/WiX(.msi) を署名し override でその場置換する（macOS レグは署名しない）。
      # 認証情報は Secrets のみ（ES_USERNAME / ES_PASSWORD / CREDENTIAL_ID / ES_TOTP_SECRET）。ログに出さない。
      # セキュリティ: sslcom/esigner-codesign は署名資格情報を受け取るため、@develop ではなく
      #   レビュー済みのコミット SHA / リリースタグへ固定することを推奨（供給網対策）。
      - name: Locate Windows installers
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        id: installers
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE//\\//}"
          echo "exe=$(ls "$ws"/apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | head -n1)" >> "$GITHUB_OUTPUT"
          echo "msi=$(ls "$ws"/apps/desktop/src-tauri/target/release/bundle/msi/*.msi | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Sign NSIS installer (.exe)
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ steps.installers.outputs.exe }}
          override: true

      - name: Sign WiX installer (.msi)
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ steps.installers.outputs.msi }}
          override: true

      # 生成されたインストーラだけを workflow artifact として保存する。
      # 各 OS は自分の成果物のみ一致する（他 OS のパターンは 0 件でよい）。
      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      # public の StreamDock-releases に Release 下書きを作り、全 OS の成果物を添付する。
      - name: Publish to public releases repo (draft)
        uses: softprops/action-gh-release@v2
        with:
          repository: satoh23/StreamDock-releases
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          draft: true
          files: dist/**/*
