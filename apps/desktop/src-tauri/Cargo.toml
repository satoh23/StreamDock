[package]
name = "stream-dock"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stream_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 033f OBS 透過オーバーレイ窓: 背景透過のオーバーレイ窓（label `comment-overlay`）を OBS の
# ウィンドウキャプチャで取り込むため、macOS では `WebviewWindowBuilder.transparent()` が
# `macos-private-api` feature でのみコンパイル・実行時適用される（tauri crate 側で cfg gate）。
# tauri.conf.json の `macOSPrivateApi: true` は Tauri CLI 経路（tauri dev/build）でのみ feature を自動付与する
# ため、CLI を通らない `cargo check` でも透過窓が通るよう **既存 tauri crate の feature 追加**として明示有効化する
# （新規 crate 追加ではない＝028 の windows feature 追加と同型）。macOS 私的 API 使用のため Mac App Store 配布不可に
# なるが、本アプリは .app/.dmg 直配布で MAS 経路は無いため受容（docs/security.md §10）。
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 019 Preset Auto-Launch on Boot: OS のログイン項目に stream-dock を登録/解除する公式プラグイン。
# 手書きの LaunchAgent/レジストリ書込（docs/security.md §5 違反）を避けるため公式実装を用いる。
# reconcile（フラグ付きプリセットが 1 つ以上 ⇔ 有効）で enable/disable し、OS 起動時は `--autostart`
# 付きで起動して手動起動と区別する。
tauri-plugin-autostart = "2"
# 032c-b コメントビューア Twitch 連携: Twitch コメント取得 Node sidecar（externalBin
# `comment-sidecar-<triple>`）を **Rust から** 起動/停止・パス解決（`-<triple>`）・stdout でのポート
# 受け渡しに使う。sidecar spawn は `app.shell().sidecar()`（Rust 専用）からのみで、frontend に shell 面を
# 出さない＝capability に `shell:*` はゼロ付与（`app.shell().sidecar()` は IPC を通らない）。
# 自由な shell 実行（§4）は解禁しない。詳細は docs/security.md「コメントビューア（配信サービス連携）方針」。
tauri-plugin-shell = "2"
# 055b アプリ自己アップデート: 公開リリース（`satoh23/StreamDock-releases`）の `latest.json` を見て更新の
# 有無を判定し、055d で DL／インストールする公式プラグイン。宛先は `tauri.conf.json` の
# `plugins.updater.endpoints`（コンパイル時定数・055a で設定済み）だけを正とし、**実行時に
# `UpdaterBuilder::endpoints()` で上書きしない**（＝フロントから宛先を差し替える経路がゼロ）。
# 完全性は minisign 公開鍵検証で fail-closed。
#
# ⚠ **「Rust は完全同期のまま（async/WS/HTTP crate を足さない）」方針への、正面からの例外**。
# 032c-b 以降ずっと通信面は Node sidecar に封じ込めてきた（同じ `[dependencies]` の `keyring` が
# 「同期 API（Rust 完全同期の要件に適合・tokio 不要）」で選ばれているのはその方針の記録）。だが自己
# アップデートは **Tauri プロセス自身が自分を置き換える**性質上 sidecar に寄せられない（sidecar は
# コメビュ窓を開いている間しか生きておらず、plugin 内部の reqwest は sidecar のホストガードを通らない）。
# 推移依存として reqwest / rustls / zip / tar / flate2 / minisign-verify 等が入る（tokio は Tauri v2 が既に保持）。
# 代替案と却下理由: ①GitHub API 直参照＋手動 DL 誘導は reqwest を避けられる唯一の案だが「アプリから更新まで
# 完結」という要望を満たさない ②検出だけ webview fetch にする案は、インストールで結局 reqwest が要るのに
# egress ホストだけ 1 つ増える。詳細は docs/security.md §1 の「例外（055・アプリ自己アップデート）」と §10。
#
# feature は**既定（rustls-tls + zip）と同じ内容を明示固定**する（`image` の default-features=false と同型）。
# - rustls-tls: TLS を pure-Rust の rustls に固定し **native-tls/OpenSSL を持ち込まない**（クロスビルドを増やさない）。
#   将来 crate 側の既定が変わっても TLS 実装が黙って入れ替わらないよう明示する。
# - zip      : flate2/tar/zip を引く。**macOS の `.app.tar.gz` 展開に必須**。⚠ 落とさないこと。
#              （レビュー指摘で訂正: 当初「サイレントに mac の自己更新だけ死ぬ」と書いていたが誤り。
#              plugin の `#[cfg(target_os = "macos")] impl Update` は `flate2`/`tar` を **feature gate 無しで**
#              使っており、この 2 つは `zip = ["dep:zip", "dep:tar", "dep:flate2"]` でしか有効化されない optional 依存。
#              ＝落とすと **macOS では cargo check の時点でコンパイルエラー**になり、必ず気付く。）
# 明示的に足さないもの: `tauri-plugin-process`（再起動は `AppHandle::restart()`＝`process:allow-restart` を
# 配らずに済む）／JS 側 `@tauri-apps/plugin-updater`（capability を広げないため。`updater:*` はゼロ付与）。
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "rustls-tls",
    "zip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
ts-rs = "10"
# 032c-b コメントビューア Twitch 連携（ログイン永続化）: Twitch OAuth の refresh/access token を
# **OS のキーチェーン**（macOS Keychain / Windows Credential Manager / Linux Secret Service）へ保存し、
# アプリ/窓の再起動後もログインを維持する。sidecar は単一ファイル SEA のため native addon（keyring）を
# 持ち込めず、キーチェーン所有は Rust 側に寄せる（token は親子プロセス間の private pipe で受け渡す）。
# 単一小シークレット保存の最小・イディオム的手段で、**同期 API**（Rust 完全同期の要件に適合・tokio 不要）。
# 各 OS のネイティブ backend のみ有効化（*-native / sync-secret-service = 同期版）。docs/security.md §9/§10。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 065a 他のコメントビューアーのリスナー記録の引き継ぎ: ユーザーが選んだ**公式 CSV エクスポート 1 ファイル**を
# 読んで `viewers` へ取り込む（読み取り専用・書き込みゼロ・外部通信ゼロ・取り込み元のアプリへは一切接続しない）。
# 手書きの分割実装にしなかった理由は 2 つあり、どちらも実物の CSV で実測した性質に基づく。
# - ⚠⚠ **列順が固定ではない**。同じ環境で 2 回エクスポートしたら、列名も列数（22）も同じまま
#   **順序だけが変わった**（`screenName` が 6 列目 → 19 列目へ移動し、間の 13 列がすべてズレた）。
#   ⇒ **ヘッダ名で引く**必要があり、位置で読む実装は将来必ず壊れる。
# - **メモ（`memo`）は自由記入**でカンマ・改行・二重引用符が入りうる。取り込み元は RFC4180 の標準クォートを
#   使っている（`badges` 列の `"[{""label"":""🔧"", ""url"":""""}]"` が実証）。**引用フィールド内の改行**を
#   手書きで正しく扱うのは事故のもとで、パース事故はそのままデータ破損になる。
# pure-Rust・**外部通信なし**・ビルドスクリプトなし・**同期 API**（Rust 完全同期の要件に適合・tokio 不要）。
# ⚠ `serde` は既存依存だが **serde 連携（`deserialize()`）は使わない**——列が版ごとに増減しうるので、
#   ヘッダ索引 ＋ 明示 `get` のほうが「必須列が無ければ 1 行も取り込まない」を書きやすい。
# ⚠ **async / HTTP / tokio 系を持ち込まないことが受け入れ条件**（`rodio` を入れたときと同じ基準で、
#   `tauri-plugin-updater` のような「正面からの例外」ではない）。docs/security.md §5 の 065a 追補と §10。
csv = "1"

# 018/028 アイコン抽出の共通 PNG エンコード経路（`tools/icon.rs::encode_png_base64`）で使用する。
# 018 では macOS 限定ブロックにあったが、028 で Windows 抽出も同じ `encode_png_base64`（≤128px PNG →
# base64）に合流させるため、共通 `[dependencies]` へ移動した（機能スペックは維持・新規クレート追加ではない）。
# いずれも pure-Rust・外部通信なし。`image` は png コーデックのみ有効化して依存面を最小化する。
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# 058a 音声ルーティング基盤（通知音の Rust 再生）: 出力デバイスを**列挙**し、**指定したデバイスで**音を鳴らす。
# 用途は「配信に載せる音（読み上げ＝OS 既定へ出す）」と「載せない音（通知音＝実デバイスへ明示指定）」の
# 出し分けで、059 の通知音がこの基盤を使う。**入力（マイク）には一切触れない**（`output_devices()` のみ）。
#
# ⚠ **webview 側では実現できないことが 058s の実測で確定している**（＝この crate が要る理由）。
# macOS(WKWebView) は `navigator.mediaDevices` ごと非対応で `setSinkId` が存在しない。Windows(WebView2) は
# `setSinkId` が存在するのに `enumerateDevices` が `deviceId`・`label` とも空の 1 件しか返さず、**渡せる ID が
# 無い**。`selectAudioOutput` は両 OS とも未実装で、**マイク権限を取らずに label を得る道は存在しなかった**。
# ＝「ユーザーが出力先を選べる」の前提条件は Rust 側にしか無い（Rust は権限なしで名前と安定 ID を返す）。
#
# ⚠ **「Rust は完全同期のまま（async/WS/HTTP crate を足さない）」方針の例外ではない。**
# `tokio` / `async-std` / `futures-executor` を 1 つも引かない（rodio のサブツリーで実測）。
# `tauri-plugin-updater`（正面からの例外）とはそこが違う。再生は同期関数で行い、UI を止めないために
# `#[tauri::command(async)]`（＝Tauri v2 が既に持つ async runtime へ逃がすだけ）に載せる。
# ⚠ **ただし「逃がすだけ」で済む話ではない**（レビューでソースを確認して追記）。`tauri-macros` が付ける
#   tracing ラベル `"sync_threadpool"` は**ラベル文字列にすぎず**、実体は `tauri/src/ipc/mod.rs` の
#   `respond_async` → **`async_runtime::spawn`**（`spawn_blocking` **ではない**）＝ tokio の
#   マルチスレッドランタイムの **worker を 1 本占有したまま**再生完了を待つ。窓生成コマンドや
#   `check_app_update` / `install_app_update` と同じランタイムを共有するので、積み上がると IPC が詰まる。
#   → `audio::service` に**同時再生 1 本の上限**（`PLAYING` / `PlaybackGuard`）を持たせて構造的に塞いだ。
# 外部通信ゼロ・ファイル I/O ゼロ（音源はアプリ内で合成するので、同梱アセットもパス解決も存在しない）。
#
# feature は `default-features = false` ＋ **`playback` だけ**に絞る（`image` / `tauri-plugin-updater` と同型）。
# - playback: `cpal` を引く。デバイス列挙（`cpal::traits::HostTrait::output_devices`）と
#   OS 出力ストリーム（`rodio::DeviceSinkBuilder`）の本体。**これが無いと何もできない。**
# ⚠ **既定のままにしないこと。** default は `playback, recording, flac, mp3, mp4, vorbis, wav, dither` で、
#   symphonia のデコーダ一式が入り **126 crate** に膨らむ（`zip` feature を落とすなという 055b の申し送りと
#   同種の地雷だが、向きは逆＝こちらは「足すな」）。
# ⚠ **`wav` も足さない。** rodio 0.22 の `wav` は `["symphonia-wav", "symphonia-pcm"]` の別名で、
#   足すと symphonia / -core / -format-riff / -codec-pcm / -metadata が入る（058s は
#   `features = ["playback", "wav"]` を指示していたが、これは 058a 着手時の実測で訂正した）。
#   **本タスクはデコーダを必要としない**——音は `SineWave` / `SamplesBuffer` でアプリ内合成し、
#   `Player::connect_new(mixer).append(source)` で鳴らす（この 3 つはいずれも feature gate されていない）。
#   decoder が要るのは `rodio::play(mixer, reader)` だけで、それは使わない。
#   059 で既製の WAV を同梱したくなったときに初めて `wav` を足す（そのとき §10 に追記すること）。
# ⚠ **`rodio::speakers`（`available_outputs` / `SpeakersBuilder`）は使わない**——`experimental` feature 配下。
#   安定 API の `DeviceSinkBuilder::from_device(device)` → `open_stream()` 経路を使う。
# 明示的に足さないもの: **`cpal` の直接依存**（`rodio::cpal` の再エクスポートを使う＝バージョン不整合を作らない）／
#   音声デコーダ（上記）／HTTP・async 系 crate／`recording`（マイク＝入力に触れないため feature ごと落とす）。
#
# ⚠ **Windows 申し送り（098）**: cpal 0.17 は `windows` crate を `>=0.59, <=0.62` で要求する。
#   ⚠ レビューで実測して訂正（当初「058a のせいで 2 系統並ぶ」と書いていたが誤り）:
#   `cargo tree --target x86_64-pc-windows-msvc -i windows` の実測は **0.58.0 / 0.61.3 / 0.62.2 の 3 系統**で、
#   内訳は 0.58.0＝自前（028 の Win32）／0.61.3＝`tao`→`tauri-runtime-wry`／0.62.2＝**cpal**。
#   つまり **0.58 と 0.61.3 の併存は 058a 以前からの状態**であって、058a が足すのは **3 本目の 0.62.2 だけ**。
#   ⚠ しかも 0.x 同士は semver 非互換で cargo が決して統合しないため、**「統一」は 098 でも達成できない**
#   （028 を 0.62 へ上げても `tao` の 0.61.3 が残る＝到達点は 3→2）。098 で判断するのは統一の可否ではなく
#   **ビルドサイズと重複コードの重複コストを許容するか**である。
# ⚠ **Windows は未検証**（058s の実測は macOS のみ）。詳細は docs/tasks/058a の「Windows 未検証」節。
# docs/security.md §4（OS 操作）／§9（デバイス名・ID をログに出さない）／§10（依存）。
rodio = { version = "0.22", default-features = false, features = ["playback"] }

# macOS の `.app` は `/usr/bin/open`（LaunchServices）経由で起動するため、掴む Child は実アプリでは
# なく即終了する open ヘルパになる。013 では起動した実アプリの PID を解決し、その PID の生存確認・停止
# （kill）に sysinfo を用いる（shell 非経由）。用途は自分が起動したプロセスの PID 解決・生存確認・kill に
# 限定し、Windows/Linux ビルドには載せない（macOS 限定ターゲット依存）。
[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.39"

# 018 Tool Icon Auto-Extraction（macOS 限定）。ユーザーが選択した `.app` の Info.plist を読み、
# `CFBundleIconFile` から `.icns` を解決して実アイコンを PNG(base64) 化する（読み取り専用・外部通信なし）。
# 用途をアイコン抽出に限定し、いずれも pure-Rust。macOS 専用の plist/icns デコードのみをここに残す
# （PNG エンコード用の `image` / `base64` は 028 で共通 `[dependencies]` へ移動した）。
# ※ image 0.25 は推移依存として moxcms / pxfm（カラーマネジメント）等を引くが、いずれも pure-Rust で
#   ネットワーク/ビルドスクリプト系ではなく監査上問題ない（Cargo.lock に解決済み・§10）。
# - plist: Info.plist（XML/バイナリ両対応）パース
# - icns : `.icns` デコード（最大サイズ取得）
plist = "1"
icns = "0.3"

# 018 フォールバック（Calendar 等アセットカタログのみのアプリ対応）。`.icns` を持たない `.app`
# （アイコンが `Assets.car` 内にのみ存在）では `CFBundleIconFile`→`.icns` 経路が解決できないため、
# AppKit の `NSWorkspace.iconForFile:`（Finder が表示する実アイコン）で取得し PNG(base64) 化する。
# 読み取り専用・外部通信なし。objc2 系は Tauri が既定 feature 付きで依存ツリーに導入済み
# （Cargo.lock に解決済み）で、feature は cargo により union されるため追加のビルド面は増えない（§10）。
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# 「開く」ボタン（バグ1）で既存プロセスを前面化するため、Windows では stream-dock が保持する PID
# （とその子プロセスツリー）からトップレベルウィンドウを特定し、SetForegroundWindow で前面化する。
# 用途を Win32 のウィンドウ操作・プロセス列挙（子プロセス探索）に限定し、shell を経由しない。
# macOS/Linux ビルドには載せない（Windows 限定ターゲット依存。sysinfo の macOS 限定と同じ扱い）。
# Microsoft 公式クレート。必要最小の feature のみ有効化する（docs/security.md §10）。
#
# 028 Windows App Icon Auto-Extraction: ユーザー選択済み `.exe` の実アイコンを OS（シェル）から
# 読み取り、PNG(base64) 化するために feature を追加する（読み取り専用・書込/削除/外部通信なし）。
# 抽出は `tools/icon.rs::windows`（主経路 IShellItemImageFactory::GetImage・フォールバック SHGetFileInfoW）で行う。
# - Win32_UI_Shell         : SHCreateItemFromParsingName / IShellItemImageFactory / SHGetFileInfoW（実アイコン取得）
# - Win32_Graphics_Gdi     : GetObjectW / GetDIBits / HBITMAP / BITMAP / DeleteObject / DC 系 / GetIconInfo（DIB 変換）
# - Win32_System_Com       : CoInitializeEx / CoUninitialize（GetImage の COM 初期化）
# - Win32_Storage_FileSystem: SHGetFileInfoW の第2引数 FILE_FLAGS_AND_ATTRIBUTES に必要（0.58 の feature gate 上必須）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
] }

