[package]
name = "stream-dock"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stream_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
ts-rs = "10"

# macOS の `.app` は `/usr/bin/open`（LaunchServices）経由で起動するため、掴む Child は実アプリでは
# なく即終了する open ヘルパになる。013 では起動した実アプリの PID を解決し、その PID の生存確認・停止
# （kill）に sysinfo を用いる（shell 非経由）。用途は自分が起動したプロセスの PID 解決・生存確認・kill に
# 限定し、Windows/Linux ビルドには載せない（macOS 限定ターゲット依存）。
[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.39"

# 「開く」ボタン（バグ1）で既存プロセスを前面化するため、Windows では stream-dock が保持する PID
# （とその子プロセスツリー）からトップレベルウィンドウを特定し、SetForegroundWindow で前面化する。
# 用途を Win32 のウィンドウ操作・プロセス列挙（子プロセス探索）に限定し、shell を経由しない。
# macOS/Linux ビルドには載せない（Windows 限定ターゲット依存。sysinfo の macOS 限定と同じ扱い）。
# Microsoft 公式クレート。必要最小の feature のみ有効化する（docs/security.md §10）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

